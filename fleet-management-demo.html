:root {
  /* ==== 1. RAW SCALES — never used directly ============================== */
  --brand-050: oklch(0.972 0.014 38);
  --brand-100: oklch(0.941 0.032 38);
  --brand-200: oklch(0.885 0.062 36);
  --brand-300: oklch(0.812 0.104 35);
  --brand-400: oklch(0.723 0.152 34);
  --brand-500: oklch(0.6399 0.189 32.51); /* #F05322 */
  --brand-600: oklch(0.578 0.178 31);
  --brand-700: oklch(0.492 0.152 30);
  --brand-800: oklch(0.404 0.122 30);
  --brand-900: oklch(0.318 0.092 30);

  --gray-050: oklch(0.985 0.002 264);
  --gray-100: oklch(0.968 0.004 264);
  --gray-200: oklch(0.928 0.006 264);
  --gray-300: oklch(0.872 0.008 264);
  --gray-400: oklch(0.712 0.012 264);
  --gray-500: oklch(0.596 0.014 264);
  --gray-600: oklch(0.502 0.014 264);
  --gray-700: oklch(0.412 0.014 264);
  --gray-800: oklch(0.316 0.012 264);
  --gray-900: oklch(0.238 0.010 264);
  --gray-950: oklch(0.176 0.008 264);
  --gray-990: oklch(0.132 0.008 264);

  /* danger hue 14 vs brand hue 32.5 — 18.5° apart, see DS decision 1 */
  --green-fg: oklch(0.498 0.114 158);
  --green-bg: oklch(0.955 0.038 160);
  --green-br: oklch(0.878 0.062 158);
  --amber-fg: oklch(0.508 0.118 74);
  --amber-bg: oklch(0.962 0.052 88);
  --amber-br: oklch(0.888 0.078 82);
  --crimson-fg: oklch(0.545 0.205 14);
  --crimson-bg: oklch(0.958 0.028 14);
  --crimson-br: oklch(0.878 0.058 14);
  --blue-fg: oklch(0.512 0.132 248);
  --blue-bg: oklch(0.958 0.032 248);
  --blue-br: oklch(0.878 0.052 248);

  /* ==== 2. SEMANTIC ROLES — the only thing components see ================ */
  --bg: var(--gray-100);
  --surface: oklch(1 0 0);
  --surface-2: var(--gray-050);
  --surface-3: var(--gray-200);
  --rail: oklch(1 0 0);

  --border: var(--gray-200);
  --border-strong: var(--gray-300);

  --text: var(--gray-900);
  --text-2: var(--gray-700);
  --text-muted: var(--gray-500);
  --text-inverse: oklch(1 0 0);

  --accent: var(--brand-500);
  --accent-hover: var(--brand-600);
  --accent-active: var(--brand-700);
  --accent-soft: var(--brand-050);
  --accent-border: var(--brand-200);
  --on-accent: oklch(1 0 0);

  --ok-fg: var(--green-fg);     --ok-bg: var(--green-bg);     --ok-br: var(--green-br);
  --warn-fg: var(--amber-fg);   --warn-bg: var(--amber-bg);   --warn-br: var(--amber-br);
  --bad-fg: var(--crimson-fg);  --bad-bg: var(--crimson-bg);  --bad-br: var(--crimson-br);
  --info-fg: var(--blue-fg);    --info-bg: var(--blue-bg);    --info-br: var(--blue-br);
  --neutral-fg: var(--gray-600);--neutral-bg: var(--gray-100);--neutral-br: var(--gray-200);

  /* Inverted surface: tooltip + toast read against the page */
  --surface-inverse: var(--gray-900);
  --on-surface-inverse: var(--gray-050);
  --surface-inverse-br: transparent;

  /* Text on a status fill, and on the fixed-dark hero */
  --on-status: oklch(1 0 0);
  --on-hero: oklch(1 0 0);
  --on-hero-dim: oklch(1 0 0 / .62);
  --on-hero-line: oklch(1 0 0 / .18);
  --on-hero-br: oklch(1 0 0 / .28);
  --on-hero-fill: oklch(1 0 0 / .10);
  --on-hero-fill-hover: oklch(1 0 0 / .18);

  --focus-ring: 0 0 0 2px var(--surface), 0 0 0 4px oklch(0.6399 0.189 32.51 / 0.55);

  --shadow-card: 0 1px 2px oklch(0.238 0.01 264 / 0.06);
  --shadow-pop: 0 8px 24px -6px oklch(0.238 0.01 264 / 0.18),
                0 2px 6px oklch(0.238 0.01 264 / 0.06);
  --shadow-modal: 0 24px 64px -12px oklch(0.238 0.01 264 / 0.30),
                  0 4px 12px oklch(0.238 0.01 264 / 0.08);
  --shadow-accent: 0 1px 2px oklch(0.6399 0.189 32.51 / 0.35);

  /* Only two gradients exist. A third use requires a new token. */
  --gradient-hero: linear-gradient(101deg,
      oklch(0.238 0.01 264) 0%, oklch(0.276 0.03 28) 52%, oklch(0.404 0.122 30) 100%);
  --gradient-map: linear-gradient(180deg,
      oklch(0.968 0.004 264) 0%, oklch(0.941 0.010 250) 100%);

  /* ==== 3. MEASURE — 4px grid =========================================== */
  --sp-1: 2px;  --sp-2: 4px;  --sp-3: 6px;  --sp-4: 8px;
  --sp-5: 12px; --sp-6: 16px; --sp-7: 20px; --sp-8: 24px;
  --sp-9: 32px; --sp-10: 40px; --sp-11: 48px;

  --r-chip: 4px; --r-control: 8px; --r-card: 12px; --r-panel: 16px; --r-pill: 999px;

  --font: "General Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
  --fs-micro: 11px; --lh-micro: 14px;
  --fs-xs: 12px;    --lh-xs: 16px;
  --fs-sm: 13px;    --lh-sm: 18px;
  --fs-md: 14px;    --lh-md: 20px;
  --fs-lg: 16px;    --lh-lg: 24px;
  --fs-xl: 20px;    --lh-xl: 28px;
  --fs-2xl: 24px;   --lh-2xl: 32px;
  --fs-page: clamp(24px, 2.2vw, 30px);
  --fs-hero: clamp(28px, 3vw, 40px);
  --w-body: 400; --w-label: 500; --w-strong: 600;  /* 700 unused */
  --measure: 68ch;

  --row-h: 44px; --row-py: 12px; --row-px: 14px;
  --control-h: 32px; --card-pad: 16px; --toolbar-h: 52px;

  --dur-micro: 120ms; --dur-move: 200ms;
  --ease: cubic-bezier(0.32, 0.72, 0, 1);

  --rail-w: 216px;
}

/* Density: compact changes padding + heights only, never typography */
[data-density="compact"] {
  --row-h: 36px; --row-py: 8px; --row-px: 12px;
  --control-h: 28px; --card-pad: 12px; --toolbar-h: 44px;
}

/* ---- Dark: hierarchy carried by surface lightness, not shadow ----------- */
[data-theme="dark"] {
  --bg: var(--gray-990);
  --surface: var(--gray-950);
  --surface-2: oklch(0.212 0.009 264);
  --surface-3: oklch(0.262 0.010 264);
  --rail: oklch(0.156 0.008 264);
  --border: oklch(0.288 0.010 264);
  --border-strong: oklch(0.372 0.012 264);
  --text: var(--gray-100);
  --text-2: oklch(0.812 0.008 264);
  --text-muted: oklch(0.652 0.012 264);
  --text-inverse: var(--gray-990);

  --accent-soft: oklch(0.318 0.086 30);
  --accent-border: oklch(0.412 0.108 31);

  --ok-fg: oklch(0.788 0.132 158);  --ok-bg: oklch(0.288 0.052 160);  --ok-br: oklch(0.392 0.072 158);
  --warn-fg: oklch(0.842 0.128 88); --warn-bg: oklch(0.302 0.058 82); --warn-br: oklch(0.412 0.078 82);
  --bad-fg: oklch(0.762 0.148 14);  --bad-bg: oklch(0.312 0.076 12);  --bad-br: oklch(0.422 0.104 12);
  --info-fg: oklch(0.788 0.112 248);--info-bg: oklch(0.292 0.052 250);--info-br: oklch(0.398 0.068 250);

      oklch(0.212 0.009 264) 0%, oklch(0.238 0.016 250) 100%);
}
/* Same roles when the reader's OS is dark and they haven't forced light */
@media (prefers-color-scheme: dark) {

    --surface: var(--gray-950);

    --rail: oklch(0.156 0.008 264);
    --border: oklch(0.288 0.010 264);
    --border-strong: oklch(0.372 0.012 264);
    --text: var(--gray-100);
    --text-2: oklch(0.812 0.008 264);
    --text-muted: oklch(0.652 0.012 264);
    --text-inverse: var(--gray-990);
    --accent: oklch(0.688 0.175 33);

    --accent-border: oklch(0.412 0.108 31);
    --on-accent: oklch(0.152 0.02 30);

    --warn-fg: oklch(0.842 0.128 88); --warn-bg: oklch(0.302 0.058 82); --warn-br: oklch(0.412 0.078 82);
    --bad-fg: oklch(0.762 0.148 14);  --bad-bg: oklch(0.312 0.076 12);  --bad-br: oklch(0.422 0.104 12);
    --info-fg: oklch(0.788 0.112 248);--info-bg: oklch(0.292 0.052 250);--info-br: oklch(0.398 0.068 250);
    --neutral-fg: oklch(0.712 0.012 264); --neutral-bg: oklch(0.262 0.010 264); --neutral-br: oklch(0.332 0.012 264);
  --surface-inverse: var(--surface-3); --on-surface-inverse: var(--text); --surface-inverse-br: var(--border);
  --on-status: var(--gray-990);
    --focus-ring: 0 0 0 2px var(--surface), 0 0 0 4px oklch(0.748 0.152 34 / 0.65);
    --shadow-card: none;

/* ============================================================================
   BASE
   ========================================================================= */
*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: var(--fs-md);
  line-height: var(--lh-md);
  font-weight: var(--w-body);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}
h1, h2, h3 { margin: 0; font-weight: var(--w-strong); letter-spacing: -0.011em; }
h1 { font-size: var(--fs-2xl); line-height: var(--lh-2xl); }
h2 { font-size: var(--fs-xl); line-height: var(--lh-xl); }
h3 { font-size: var(--fs-lg); line-height: var(--lh-lg); }
p { margin: 0; max-width: var(--measure); }
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }

a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); text-decoration: underline; }

:where(button, a, input, select, [tabindex]):focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}

.tnum { font-variant-numeric: tabular-nums; }
.identifier { font-weight: var(--w-strong); letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.u-row { display: flex; align-items: center; gap: var(--sp-4); }
.u-col { display: flex; flex-direction: column; }
.u-grow { flex: 1; min-width: 0; }
.u-muted { color: var(--text-muted); }
.u-dim { color: var(--text-2); }
.u-micro { font-size: var(--fs-micro); line-height: var(--lh-micro); }
.u-xs { font-size: var(--fs-xs); line-height: var(--lh-xs); }
.u-sm { font-size: var(--fs-sm); line-height: var(--lh-sm); }
.u-label {
  font-size: var(--fs-micro); line-height: var(--lh-micro); font-weight: var(--w-label);
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted);
}
.u-truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ============================================================================
   ICONS — 14 / 16 / 20, stroked
   ========================================================================= */
.ico { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor;
       stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.ico--sm { width: 13px; height: 13px; }
.ico--lg { width: 20px; height: 20px; }

/* ============================================================================
   BUTTON — md 32px, sm 26px, radius 8
   ========================================================================= */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-3);
  height: var(--control-h); padding: 0 14px;
  border: 1px solid transparent; border-radius: var(--r-control);
  background: var(--surface); color: var(--text);
  font-family: inherit; font-size: var(--fs-sm); font-weight: var(--w-label);
  cursor: pointer; white-space: nowrap;
  transition: background var(--dur-micro) var(--ease), border-color var(--dur-micro) var(--ease);
}
.btn--primary { background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow-accent); }
.btn--primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn--primary:active:not(:disabled) { background: var(--accent-active); transform: translateY(1px); }

.btn--secondary { border-color: var(--border-strong); background: var(--surface); }
.btn--secondary:hover:not(:disabled) { background: var(--surface-2); }

.btn--ghost { background: transparent; color: var(--text-2); }
.btn--ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }

/* The only filled red surface in the product */
.btn--danger { background: var(--bad-fg); color: var(--text-inverse); }
.btn--danger:hover:not(:disabled) { filter: brightness(1.08); }

.btn:disabled {
  border-color: var(--border); background: var(--surface-3);
  color: var(--text-muted); cursor: not-allowed; box-shadow: none;
}
.btn--sm { height: 26px; padding: 0 10px; font-size: var(--fs-xs); }
.btn--icon { width: var(--control-h); padding: 0; }
.btn--sm.btn--icon { width: 26px; }
.btn[data-loading] { color: transparent; position: relative; pointer-events: none; }
.btn[data-loading]::after {
  content: ""; position: absolute; width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid currentColor; border-top-color: transparent;
  color: var(--on-accent); animation: spin 700ms linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ============================================================================
   FIELD — text / search / number
   ========================================================================= */
.field { position: relative; display: inline-flex; align-items: center; width: 100%; }
.field__ico {
  position: absolute; left: 10px; color: var(--text-muted); pointer-events: none;
}
.field input {
  width: 100%; height: var(--control-h); padding: 0 12px;
  border: 1px solid var(--border-strong); border-radius: var(--r-control);
  background: var(--surface); color: var(--text); font-size: var(--fs-sm);
}
.field input::placeholder { color: var(--text-muted); }
.field--search input { padding-left: 32px; padding-right: 34px; }
.field input:disabled { background: var(--surface-3); color: var(--text-muted); cursor: not-allowed; }
.field--num input { text-align: right; font-variant-numeric: tabular-nums; padding-right: 34px; }
.field__suffix, .kbd {
  position: absolute; right: 8px; color: var(--text-muted); font-size: var(--fs-xs);
}
.kbd {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 18px; padding: 0 5px;
  border: 1px solid var(--border-strong); border-radius: var(--r-chip);
  background: var(--surface-2); font-size: var(--fs-micro); font-weight: var(--w-label);
}
.field__help { display: block; margin-top: var(--sp-2); font-size: var(--fs-xs); color: var(--text-muted); }

/* ============================================================================
   CHIP — 22px, radius 4. Status is never a filled surface.
   ========================================================================= */
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  height: 22px; padding: 0 7px; border-radius: var(--r-chip);
  font-size: var(--fs-xs); font-weight: var(--w-label); line-height: 1;
  white-space: nowrap;
  color: var(--neutral-fg); background: var(--neutral-bg); border: 1px solid var(--neutral-br);
}
.chip--ok   { color: var(--ok-fg);   background: var(--ok-bg);   border-color: var(--ok-br); }
.chip--warn { color: var(--warn-fg); background: var(--warn-bg); border-color: var(--warn-br); }
.chip--bad  { color: var(--bad-fg);  background: var(--bad-bg);  border-color: var(--bad-br); }
.chip--info { color: var(--info-fg); background: var(--info-bg); border-color: var(--info-br); }
/* "not required" — quiet, not an error: no fill, dashed edge */
.chip--quiet { background: transparent; border-style: dashed; color: var(--text-muted); }
.chip--outline { background: transparent; border-color: var(--border-strong); color: var(--text-2); }
.chip__count { min-width: 20px; justify-content: center; font-variant-numeric: tabular-nums; }
.chip__x { display: inline-flex; margin-right: -2px; cursor: pointer; opacity: .7; }
.chip__x:hover { opacity: 1; }

/* ============================================================================
   TOOLTIP — opens on hover and on keyboard focus, 400ms delay
   ========================================================================= */
.tip { position: relative; border-bottom: 1px dotted currentColor; cursor: help; }
.tip::after {
  content: attr(data-tip);
  position: absolute; bottom: calc(100% + 6px); left: 50%; translate: -50% 0;
  width: max-content; max-width: 240px; padding: 6px 8px;
  border-radius: var(--r-control);
  background: var(--surface-inverse); color: var(--on-surface-inverse);
  border: 1px solid var(--surface-inverse-br);
  font-size: var(--fs-xs); line-height: var(--lh-xs); font-weight: var(--w-body);
  letter-spacing: normal; text-transform: none; text-align: left;
  box-shadow: var(--shadow-pop); z-index: 90;
  opacity: 0; visibility: hidden;
  transition: opacity var(--dur-move) var(--ease) 400ms, visibility 0s 400ms;
}
.tip:hover::after, .tip:focus-visible::after { opacity: 1; visibility: visible; transition-delay: 400ms, 0s; }

/* ============================================================================
   CARD / TILE
   ========================================================================= */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-card); box-shadow: var(--shadow-card);
}
.card__head {
  display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-5);
  padding: var(--card-pad) var(--card-pad) 0;
}
.card__title { font-size: var(--fs-md); font-weight: var(--w-strong); }
.card__hint { font-size: var(--fs-xs); color: var(--text-muted); margin-top: 2px; }
.card__body { padding: var(--card-pad); }

.tile {
  display: flex; flex-direction: column; gap: var(--sp-2);
  padding: var(--card-pad);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-card); box-shadow: var(--shadow-card);
}
.tile__label { font-size: var(--fs-xs); color: var(--text-muted); font-weight: var(--w-label); }
.tile__value {
  font-size: var(--fs-2xl); line-height: var(--lh-2xl); font-weight: var(--w-strong);
  letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
}
/* Trend is text-2, never a status colour — the reading goes in the benefit line */
.tile__trend { display: inline-flex; align-items: center; gap: 3px; font-size: var(--fs-xs); color: var(--text-2); }
.tile__benefit { font-size: var(--fs-xs); color: var(--text-muted); }

/* ============================================================================
   TOOLBAR + TABLE
   ========================================================================= */
.panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-card); overflow: hidden; box-shadow: var(--shadow-card);
}
.toolbar {
  display: flex; align-items: center; gap: var(--sp-4);
  min-height: var(--toolbar-h); padding: var(--sp-4) var(--sp-6);
  border-bottom: 1px solid var(--border);
}
.bulkbar {
  display: flex; align-items: center; gap: var(--sp-5);
  padding: var(--sp-4) var(--sp-6);
  background: var(--accent-soft); border-bottom: 1px solid var(--accent-border);
  font-size: var(--fs-sm);
}

.tablewrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; }
table.data th {
  position: sticky; top: 0; z-index: 1;
  padding: var(--sp-4) var(--row-px);
  background: var(--surface-2); border-bottom: 1px solid var(--border);
  font-size: var(--fs-micro); line-height: var(--lh-micro); font-weight: var(--w-label);
  letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted);
  text-align: left; white-space: nowrap; cursor: pointer; user-select: none;
}
table.data th.is-num { text-align: right; }
table.data th[aria-sort] { color: var(--text); }
table.data td {
  height: var(--row-h);
  padding: var(--row-py) var(--row-px);
  border-bottom: 1px solid var(--border);
  font-size: var(--fs-sm); color: var(--text-2); white-space: nowrap;
}
table.data td.is-num { text-align: right; font-variant-numeric: tabular-nums; }
table.data tbody tr { cursor: pointer; }
table.data tbody tr:hover { background: var(--surface-2); }   /* hover stays neutral */
/* Selected row: accent-soft ground + 2px accent strip, never a saturated fill */
table.data tbody tr[aria-selected="true"] { background: var(--accent-soft); }
table.data tbody tr[aria-selected="true"] td:first-child { box-shadow: inset 2px 0 0 var(--accent); }
table.data tbody tr:last-child td { border-bottom: 0; }
table.data tbody tr:focus-visible { outline: none; box-shadow: var(--focus-ring); position: relative; z-index: 1; }
/* the native clear button collides with the "/" hint */
input[type="search"]::-webkit-search-cancel-button { display: none; }
.tablefoot {
  display: flex; align-items: center; gap: var(--sp-6);
  padding: 10px var(--sp-6); background: var(--surface-2);
  font-size: var(--fs-xs); color: var(--text-muted);
}

/* Checkbox */
.check {
  appearance: none; width: 16px; height: 16px; margin: 0;
  border: 1.5px solid var(--border-strong); border-radius: var(--r-chip);
  background: var(--surface); cursor: pointer; display: grid; place-content: center;
}
.check:checked, .check:indeterminate { background: var(--accent); border-color: var(--accent); }
.check:checked::after {
  content: ""; width: 9px; height: 5px; margin-top: -2px;
  border-left: 2px solid var(--on-accent); border-bottom: 2px solid var(--on-accent);
  rotate: -45deg;
}
.check:indeterminate::after {
  content: ""; width: 8px; height: 2px; border-radius: 1px; background: var(--on-accent);
}

/* ============================================================================
   TABS — underline (in-page nav) and segmented (data scope)
   ========================================================================= */
.tabs { display: flex; gap: var(--sp-7); border-bottom: 1px solid var(--border); }
.tabs button {
  padding: 0 0 10px; border: 0; background: none; cursor: pointer;
  font-size: var(--fs-sm); font-weight: var(--w-label); color: var(--text-muted);
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }

.segmented {
  display: inline-flex; gap: 2px; padding: 2px;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-control);
}
.segmented button {
  height: 26px; padding: 0 12px; border: 0; border-radius: 6px;
  background: transparent; color: var(--text-2); cursor: pointer;
  font-size: var(--fs-xs); font-weight: var(--w-label);
}
.segmented button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-card); }

/* ============================================================================
   EMPTY STATE — gives the number and the way out
   ========================================================================= */
.empty {
  display: flex; flex-direction: column; align-items: center; gap: var(--sp-3);
  padding: var(--sp-11) var(--sp-6); text-align: center;
}
.empty__ico {
  display: grid; place-items: center; width: 40px; height: 40px; margin-bottom: var(--sp-1);
  border-radius: var(--r-pill); background: var(--surface-2); color: var(--text-muted);
}
.empty__title { font-size: var(--fs-md); font-weight: var(--w-strong); }
.empty__text { font-size: var(--fs-sm); color: var(--text-muted); max-width: 44ch; }

/* ============================================================================
   SKELETON
   ========================================================================= */
.skel { background: var(--surface-3); border-radius: var(--r-chip); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .55; } }

/* ============================================================================
   APP SHELL
   ========================================================================= */
.app { display: grid; grid-template-columns: var(--rail-w) 1fr; min-height: 100dvh; }

.rail {
  position: sticky; top: 0; height: 100dvh; overflow-y: auto;
  display: flex; flex-direction: column; gap: var(--sp-7);
  padding: var(--sp-5) var(--sp-4);
  background: var(--rail); border-right: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; padding: var(--sp-2) var(--sp-3); color: inherit; }
.brand:hover { text-decoration: none; }
.brand__mark {
  display: grid; place-items: center; width: 28px; height: 28px; flex: none;
  border-radius: var(--r-control); background: var(--accent); color: var(--on-accent);
  font-weight: var(--w-strong); font-size: var(--fs-sm); letter-spacing: -0.03em;
}
.brand__name { font-weight: var(--w-strong); line-height: 1.15; }
.brand__sub { font-size: var(--fs-micro); color: var(--text-muted); line-height: 1.2; }

.nav { display: flex; flex-direction: column; gap: 1px; }
.nav__item {
  display: flex; align-items: center; gap: 10px;
  height: 34px; padding: 0 10px; border-radius: var(--r-control);
  color: var(--text-2); font-size: var(--fs-md); font-weight: var(--w-label);
}
.nav__item:hover { background: var(--surface-2); color: var(--text); text-decoration: none; }
.nav__item[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav__count { margin-left: auto; font-size: var(--fs-xs); color: var(--text-muted); font-variant-numeric: tabular-nums; }
.rail__foot { margin-top: auto; padding: var(--sp-3); }

.concept {
  display: inline-flex; align-items: center; gap: var(--sp-3);
  height: 22px; padding: 0 8px; border-radius: var(--r-pill);
  border: 1px dashed var(--border-strong); color: var(--text-muted);
  font-size: var(--fs-micro); font-weight: var(--w-label);
}
.concept::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }

.main { display: flex; flex-direction: column; min-width: 0; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: var(--sp-5);
  height: 56px; padding: 0 var(--sp-8);
  background: var(--bg); border-bottom: 1px solid var(--border);
}
.topbar__title { font-size: var(--fs-lg); font-weight: var(--w-strong); }
.topbar__actions { margin-left: auto; display: flex; align-items: center; gap: var(--sp-4); }
.view { flex: 1; padding: var(--sp-8); }
.view:focus { outline: none; }

/* ============================================================================
   TOAST
   ========================================================================= */
.toasts {
  position: fixed; z-index: 80; bottom: var(--sp-6); left: 50%; translate: -50% 0;
  display: flex; flex-direction: column-reverse; gap: var(--sp-4);
  width: min(30rem, calc(100vw - 32px));
}
.toast {
  display: flex; align-items: center; gap: var(--sp-5);
  padding: 10px var(--sp-5); border-radius: var(--r-control);
  background: var(--surface-inverse); color: var(--on-surface-inverse);
  border: 1px solid var(--surface-inverse-br);
  font-size: var(--fs-sm); box-shadow: var(--shadow-pop);
  animation: toastin var(--dur-move) var(--ease);
}
.toast button { border: 0; background: none; color: inherit; font-weight: var(--w-label); cursor: pointer; text-decoration: underline; }
@keyframes toastin { from { translate: 0 8px; opacity: 0; } }

/* ============================================================================
   RESPONSIVE
   ========================================================================= */
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .rail {
    position: static; height: auto; flex-direction: row; align-items: center;
    gap: var(--sp-5); padding: var(--sp-4) var(--sp-5);
    border-right: 0; border-bottom: 1px solid var(--border); overflow-x: auto;
  }
  .rail .nav { flex-direction: row; }
  .rail__foot, .brand__sub { display: none; }
  .view, .topbar { padding-left: var(--sp-5); padding-right: var(--sp-5); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ============================================================================
   SCREENS — Overview + Vehicles (from "Modaltrans Screens.dc.html")
   ========================================================================= */

/* --- Topbar identity ----------------------------------------------------- */
.avatar {
  display: grid; place-items: center; width: 28px; height: 28px; flex: none;
  border-radius: 50%; background: var(--surface-3); color: var(--text-2);
  font-size: var(--fs-xs); font-weight: var(--w-strong);
}
.who__name { font-size: var(--fs-sm); font-weight: var(--w-label); line-height: 1.2; }
.who__role { font-size: var(--fs-micro); color: var(--text-muted); line-height: 1.2; }

/* --- Nav badges ---------------------------------------------------------- */
.nav__item[aria-current="page"] { font-weight: var(--w-strong); box-shadow: inset 2px 0 0 var(--accent); }
.nav__badge {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 18px; padding: 0 5px; margin-left: auto;
  border-radius: var(--r-chip);
  font-size: var(--fs-micro); font-weight: var(--w-strong); font-variant-numeric: tabular-nums;
  background: var(--surface-3); color: var(--text-2);
}
.nav__badge--bad { background: var(--bad-fg); color: var(--on-status); }

/* --- Hero strip (gradient use #1 of 2) ----------------------------------- */
.hero {
  display: flex; align-items: center; gap: 28px; flex-wrap: wrap;
  padding: 20px 24px; border-radius: var(--r-panel);
  background: var(--gradient-hero); color: var(--on-hero);
}
.hero__eyebrow {
  margin-bottom: 6px; font-size: var(--fs-xs); font-weight: var(--w-label);
  letter-spacing: .06em; text-transform: uppercase; color: var(--on-hero-dim);
}
.hero__line {
  max-width: 34ch; font-size: var(--fs-page); line-height: 1.15;
  font-weight: var(--w-strong); letter-spacing: -.02em;
}
.hero__stats { display: flex; gap: 28px; padding-left: 28px; border-left: 1px solid var(--on-hero-line); }
.hero__num { font-size: var(--fs-2xl); line-height: var(--lh-2xl); font-weight: var(--w-strong); font-variant-numeric: tabular-nums; }
.hero__cap { font-size: var(--fs-xs); color: var(--on-hero-dim); }
.btn--onhero { border-color: var(--on-hero-br); background: var(--on-hero-fill); color: var(--on-hero); flex: none; }
.btn--onhero:hover:not(:disabled) { background: var(--on-hero-fill-hover); }

/* --- Stat tile extras ---------------------------------------------------- */
.tile__top { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4); }
.tile__dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.tile__row { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--sp-4); }
.spark { width: 120px; height: 24px; flex: none; overflow: visible; }
.spark polyline { fill: none; stroke: var(--border-strong); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

/* --- Attention list ------------------------------------------------------ */
.attn {
  display: flex; align-items: center; gap: var(--sp-5);
  width: 100%; padding: 10px var(--sp-6); border: 0; border-bottom: 1px solid var(--border);
  background: var(--surface); color: inherit; text-align: left; cursor: pointer;
}
.attn:hover { background: var(--surface-2); }
.attn:last-child { border-bottom: 0; }
.attn__ico {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: var(--r-control); flex: none;
}
.attn__ico--bad  { color: var(--bad-fg);  background: var(--bad-bg);  border: 1px solid var(--bad-br); }
.attn__ico--warn { color: var(--warn-fg); background: var(--warn-bg); border: 1px solid var(--warn-br); }
.attn__ico--info { color: var(--info-fg); background: var(--info-bg); border: 1px solid var(--info-br); }
.attn__title { font-size: var(--fs-sm); font-weight: var(--w-label); }
.attn__sub { font-size: var(--fs-xs); color: var(--text-muted); }
.attn__count { font-size: var(--fs-md); font-weight: var(--w-strong); font-variant-numeric: tabular-nums; }

/* --- Genie --------------------------------------------------------------- */
.genie { display: flex; gap: var(--sp-5); padding: var(--card-pad); }
.genie__mark {
  display: grid; place-items: center; width: 26px; height: 26px; flex: none;
  border-radius: var(--r-control); background: var(--accent-soft);
  color: var(--accent); border: 1px solid var(--accent-border);
}
.genie__head { display: flex; align-items: center; gap: var(--sp-4); margin-bottom: var(--sp-2); }
.genie__name { font-size: var(--fs-xs); font-weight: var(--w-strong); letter-spacing: .02em; }
.genie__body { font-size: var(--fs-sm); line-height: 19px; }
.genie__acts { display: flex; gap: var(--sp-4); margin-top: var(--sp-5); }

/* --- Corridor map (gradient use #2 of 2) --------------------------------- */
.map { position: relative; height: 180px; background: var(--gradient-map); }
.pin { position: absolute; display: flex; translate: -50% -50%; border: 0; background: none; padding: 0; cursor: pointer; }
.pin svg { width: 20px; height: 20px; stroke-width: 1.4; }
.pin--ok   { color: var(--ok-fg);   fill: var(--ok-bg); }
.pin--info { color: var(--info-fg); fill: var(--info-bg); }
.pin--bad  { color: var(--bad-fg);  fill: var(--bad-bg); }
.pin--sel  { color: var(--accent);  fill: var(--surface); }
.pin--sel svg { width: 24px; height: 24px; stroke-width: 1.5; }
.pin--sel::before {
  content: ""; position: absolute; inset: -6px; border-radius: 50%;
  border: 1.5px solid var(--accent); animation: ping 2.4s ease-out infinite;
}
@keyframes ping { 0% { scale: 1; opacity: .5; } 100% { scale: 2.4; opacity: 0; } }
.cluster {
  position: absolute; translate: -50% -50%;
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--surface); border: 1px solid var(--border-strong);
  box-shadow: var(--shadow-card);
  font-size: var(--fs-micro); font-weight: var(--w-strong); font-variant-numeric: tabular-nums;
}
.legend { display: flex; flex-wrap: wrap; gap: var(--sp-5); padding: 10px var(--sp-6); border-top: 1px solid var(--border); font-size: var(--fs-xs); color: var(--text-muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 8px; height: 8px; border-radius: 50%; }

/* --- Trip chain ---------------------------------------------------------- */
.chain { display: grid; grid-template-columns: repeat(6, 1fr); padding: var(--sp-6) var(--sp-5) var(--sp-5); }
.chain__step { position: relative; display: flex; flex-direction: column; align-items: center; }
.chain__line { position: absolute; top: 17px; height: 2px; z-index: 0; }
.chain__node {
  position: relative; z-index: 1;
  display: inline-flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; border-radius: 50%;
}
.chain__node--done    { background: var(--ok-fg); color: var(--on-status); border: 1px solid var(--ok-fg); }
.chain__node--current { background: var(--accent); color: var(--on-accent); border: 1px solid var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.chain__node--blocked { background: var(--bad-bg); color: var(--bad-fg); border: 1.5px solid var(--bad-fg); }
.chain__node--pending { background: var(--surface); color: var(--text-muted); border: 1.5px dashed var(--border-strong); }
.chain__name { margin-top: var(--sp-3); font-size: var(--fs-xs); font-weight: var(--w-label); text-align: center; }
.chain__meta { margin-top: 2px; font-size: var(--fs-micro); line-height: 15px; text-align: center; color: var(--text-muted); }
.chain__meta--accent { color: var(--accent); }
.chain__meta--bad { color: var(--bad-fg); }

/* --- Vehicles toolbar ---------------------------------------------------- */
.filters { display: flex; align-items: center; gap: var(--sp-4); flex-wrap: wrap; padding: var(--sp-4) var(--sp-6); border-bottom: 1px solid var(--border); }
.cell-2 { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.cell-2 b { font-weight: var(--w-label); color: var(--text); font-size: var(--fs-sm); }
.cell-2 span { font-size: var(--fs-micro); color: var(--text-muted); }

/* --- Layout -------------------------------------------------------------- */
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-5); }
.grid-split { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-5); align-items: start; }
@media (max-width: 1180px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } .grid-split { grid-template-columns: 1fr; } }
@media (max-width: 720px) {
  .grid-4 { grid-template-columns: 1fr; }
  .hero__stats { padding-left: 0; border-left: 0; }
}


/* ============================================================================
   ASSIGN FLOW — left list keeps the choice, right side refreshes,
   action bar stays put at the bottom.
   ========================================================================= */
.split { display: grid; grid-template-columns: 340px 1fr; gap: var(--sp-5); align-items: start; }
@media (max-width: 1080px) { .split { grid-template-columns: 1fr; } }

.triplist { max-height: calc(100dvh - 210px); overflow-y: auto; }
.triprow {
  display: block; width: 100%; text-align: left; cursor: pointer;
  padding: var(--row-py) var(--row-px);
  border: 0; border-bottom: 1px solid var(--border);
  background: var(--surface); color: inherit; font: inherit;
}
.triprow:hover { background: var(--surface-2); }
.triprow[aria-selected="true"] { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
.triprow:last-child { border-bottom: 0; }
.triprow__top { display: flex; align-items: center; gap: var(--sp-4); }
.triprow__ref { font-size: var(--fs-sm); font-weight: var(--w-strong); letter-spacing: .02em; color: var(--text); }
.triprow__meta { margin-top: 2px; font-size: var(--fs-xs); color: var(--text-muted); }

/* --- Trip header --------------------------------------------------------- */
.triphead { display: flex; align-items: flex-start; gap: var(--sp-6); flex-wrap: wrap; padding: var(--card-pad); }
.tripfact { display: flex; flex-direction: column; gap: 1px; }
.tripfact b { font-size: var(--fs-sm); font-weight: var(--w-strong); font-variant-numeric: tabular-nums; }
.tripfact span { font-size: var(--fs-micro); color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; }

/* --- Ranked vehicle card ------------------------------------------------- */
.rankcard {
  display: block; width: 100%; text-align: left; cursor: pointer;
  padding: var(--sp-5) var(--sp-6);
  border: 0; border-bottom: 1px solid var(--border);
  background: var(--surface); color: inherit; font: inherit;
}
.rankcard:hover { background: var(--surface-2); }
.rankcard[aria-selected="true"] { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
.rankcard--blocked { opacity: .58; }
.rankcard--blocked:hover { opacity: .8; }
.rankcard__top { display: flex; align-items: baseline; gap: var(--sp-4); }
.rankcard__score { margin-left: auto; font-size: var(--fs-xl); font-weight: var(--w-strong); font-variant-numeric: tabular-nums; line-height: 1; }
.rankcard__max { font-size: var(--fs-xs); font-weight: var(--w-body); color: var(--text-muted); }
.rankcard__sub { margin-top: 2px; font-size: var(--fs-xs); color: var(--text-muted); }
.rankcard__why { margin-top: var(--sp-3); font-size: var(--fs-sm); color: var(--text-2); }

/* --- Compliance rows — the safety net, spelled out ----------------------- */
.checks { margin-top: var(--sp-5); padding-top: var(--sp-5); border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: var(--sp-5); }
.check-row { display: flex; gap: var(--sp-4); align-items: flex-start; }
.check-row__ico { display: grid; place-items: center; width: 20px; height: 20px; flex: none; border-radius: var(--r-chip); }
.check-row__ico--ok   { color: var(--ok-fg);   background: var(--ok-bg); }
.check-row__ico--warn { color: var(--warn-fg); background: var(--warn-bg); }
.check-row__ico--bad  { color: var(--bad-fg);  background: var(--bad-bg); }
.check-row__name { width: 128px; flex: none; font-size: var(--fs-sm); font-weight: var(--w-label); }
.check-row__why { font-size: var(--fs-sm); color: var(--text-2); }
.check-row__fix { margin-top: var(--sp-4); display: flex; align-items: center; gap: var(--sp-4); flex-wrap: wrap; }
@media (max-width: 640px) { .check-row__name { width: auto; } .check-row { flex-wrap: wrap; } }

/* --- Sticky action bar --------------------------------------------------- */
.actionbar {
  position: sticky; bottom: 0; z-index: 2;
  display: flex; align-items: center; gap: var(--sp-5); flex-wrap: wrap;
  padding: var(--sp-5) var(--sp-6);
  background: var(--surface); border-top: 1px solid var(--border);
}

/* --- Result: the ripple, one line each ----------------------------------- */
.result__row { display: flex; gap: var(--sp-5); align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--border); }
.result__row:last-child { border-bottom: 0; }
.result__where {
  width: 116px; flex: none;
  font-size: var(--fs-micro); font-weight: var(--w-label);
  letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted);
}
.result__what { font-size: var(--fs-sm); }

</style>

<script>
"use strict";

const ico = (name, cls = "ico") => `<svg class="${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const nfmt = n => n.toLocaleString("en-GB").replace(/,/g, " ");

/* ============================================================================
   STATUS TAXONOMY — the design system's five dimensions, in code.
   One semantic per state; colour never travels alone (icon + label always).
   ========================================================================= */
const T_STATUS = {
  on_trip:        { sem: "info", icon: "truck",        label: "On trip" },
  available:      { sem: "ok",   icon: "check-circle", label: "Available" },
  maintenance:    { sem: "warn", icon: "tools",        label: "In maintenance" },
  out_of_service: { sem: "bad",  icon: "x-circle",     label: "Out of service" },
};

   DATA — 10 hand-authored rows carry the demo; 32 seeded rows give it weight.
   Seed is fixed, so the table is identical on every load.

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rnd = mulberry32(20260830);
const pick = a => a[Math.floor(rnd() * a.length)];
const shuffle = a => { const x = a.slice(); for (let i = x.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [x[i], x[j]] = [x[j], x[i]]; } return x; };

function buildVehicles() {
  const list = HERO.map((r, i) => ({
    id: "v" + i, plate: r[0], driver: r[1], model: r[2], ownership: "own",
    carrier: null, status: r[3],
    maint: { state: r[4][0], ...r[4][1] },
    docs: { state: r[5][0], ...r[5][1] },
    km: r[6], corridor: r[7],
    adr: [true, false, true, false, true, true, false, false, true, false][i],
    costPerKm: +(1.28 + rnd() * 0.28).toFixed(2),
  }));

  /* Remaining 32, distributed so the headline numbers are real, not typed in:
     on trip 28 · available 8 · maintenance 4 · out of service 2  → 78% utilisation
     docs expired 3 · expiring ≤30d 12 · maintenance overdue 3    → 7 need attention */
  const statuses = shuffle([
    ...Array(23).fill("on_trip"), ...Array(5).fill("available"),
    ...Array(3).fill("maintenance"), ...Array(1).fill("out_of_service"),
  ]);
  const docs = shuffle([
    ...Array(2).fill("expired"), ...Array(9).fill("expiring"), ...Array(21).fill("valid"),
  ]);
  const maints = shuffle([
    ...Array(1).fill("overdue"), ...Array(6).fill("due"),
    ...Array(13).fill("scheduled"), ...Array(12).fill("serviced"),
  ]);

  for (let i = 0; i < 32; i++) {
    const own = i < 8;
    const city = pick(["34", "06", "35", "16", "41"]);
    const plate = `${city} TR ${1000 + Math.floor(rnd() * 8999)}`;
    const ds = docs[i], ms = maints[i];
    list.push({
      id: "v" + (10 + i), plate,
      driver: statuses[i] === "maintenance" && rnd() < .5 ? null : `${pick(FIRST)} ${pick(LAST)}`,
      model: `${pick(MODELS)} · ${pick(BODIES)}`,
      ownership: own ? "own" : "subcontracted",
      carrier: own ? null : pick(CARRIERS),
      status: statuses[i],
      maint: ms === "overdue" ? { state: ms, km: 400 + Math.floor(rnd() * 900) }
           : ms === "due" ? { state: ms, km: 150 + Math.floor(rnd() * 700) }
           : { state: ms, on: `${String(2 + Math.floor(rnd() * 26)).padStart(2, "0")} Sep` },
      docs: ds === "expiring" ? { state: ds, days: 3 + Math.floor(rnd() * 27) }
          : ds === "expired" ? { state: ds, days: 1 + Math.floor(rnd() * 9) }
          : { state: ds },
      km: 60000 + Math.floor(rnd() * 840000),
      corridor: pick(CORRIDORS),
      adr: rnd() < 0.55,
      costPerKm: +(1.28 + rnd() * 0.28).toFixed(2),
    });
  }
  return list;
}

/* --- Drivers --------------------------------------------------------------
   AETR caps daily driving at 9 hours, so 540 minutes is a full tank.
   Two drivers are deliberately under an hour — they are the ones the
   assign flow has to argue with. */
function buildDrivers(vehicles) {
  const list = [];
  vehicles.forEach(v => {
    if (!v.driver) return;
    list.push({
      id: "d" + list.length, name: v.driver, vehicleId: v.id,
      /* A driver waiting with a free truck is rested; one already rolling
         has burned part of the 9-hour AETR day. */
      minutesLeft: v.status === "available" ? 430 + Math.floor(rnd() * 110)
                 : v.status === "on_trip"   ?  90 + Math.floor(rnd() * 320)
                 :                            200 + Math.floor(rnd() * 300),
      adr: v.adr, cpcValid: true,
      tachoDaysAgo: 2 + Math.floor(rnd() * 30),
    });
  });
  /* Bench drivers — nobody's vehicle, so the flow can suggest them */
  ["Murat Yılmaz", "Selim Tuna", "Craig Wallace"].forEach(name => {
    list.push({
      id: "d" + list.length, name, vehicleId: null,
      minutesLeft: 480 + Math.floor(rnd() * 60),
      adr: true, cpcValid: true, tachoDaysAgo: 3 + Math.floor(rnd() * 10),
    });
  });
  /* Exactly two near the limit. They sit on AVAILABLE trucks on purpose:
     a driver-hours block only teaches anything on a truck you could
     otherwise have taken. */
  const freeTrucks = list.filter(d => {
    const v = vehicles.find(x => x.id === d.vehicleId);
    return v && v.status === "available";
  });
  const targets = freeTrucks.length >= 2 ? freeTrucks : list.filter(d => d.vehicleId);
  targets[0].minutesLeft = 45;
  targets[1].minutesLeft = 52;
  return list;
}

/* The chain the Overview draws — derived from the trip, so reassigning a
   vehicle visibly unblocks GVMS instead of leaving a stale picture. */
function chainFor(trip) {
  const d = trip.declarations || {};
  const ncts = d.ncts === "filed" ? ["done", "Accepted", ""]
             : d.ncts === "draft" ? ["pending", "Drafted, waiting", ""]
             : ["pending", "Not required", ""];
  const gvms = d.gvms === "missing" ? ["blocked", "No reference yet", "bad"]
             : d.gvms === "draft" ? ["pending", "Reference drafted", ""]
             : d.gvms === "filed" ? ["done", "Cleared", ""]
             : ["pending", "Not required", ""];
  return [
    ["Loading",    "done",    "file",         "28.08 · 09:40",     ""],
    ["TR Customs", "done",    "check-circle", "28.08 · 16:05",     ""],
    ["Ro-Ro",      "current", "truck",        "Trieste, boarding", "accent"],
    ["NCTS",       ncts[0],   "file",         ncts[1],             ncts[2]],
    ["GVMS",       gvms[0],   "alert",        gvms[1],             gvms[2]],
    ["Delivery",   "pending", "check",        "ETA " + trip.eta,   ""],
  ];
}

/** What is actually holding this trip up, counted rather than asserted. */
function blockersFor(trip) {
  const veh = Store.state.vehicles.find(v => v.id === trip.vehicleId);
  let n = 0;
  if (trip.declarations && trip.declarations.gvms === "missing") n++;
  if (veh && veh.docs.state === "expired") n++;
  if (veh && veh.maint.state === "overdue") n++;
  return n;
}

/* ============================================================================
   STORE — one source of truth. Every write goes through commit(), so undo
   is a property of the store rather than something each action reimplements.
   ========================================================================= */
const Store = {
  state: null,
  history: [],
  listeners: new Set(),

  init() {
    const vehicles = buildVehicles();
    this.state = {
      vehicles,
      drivers: buildDrivers(vehicles),
      trips: TRIPS.map(t => ({ ...t })),
      ui: { scope: "own", tab: "all", q: "", corridor: null, docFilter: null, selected: null, page: 0,
            assign: { tripRef: null, vehicleId: null, driverId: null, showAll: false, done: null } },
    };
    return this;
  },

  subscribe(fn) { this.listeners.add(fn); },
  emit() { this.listeners.forEach(fn => fn()); },
  ui(patch) { Object.assign(this.state.ui, patch); this.emit(); },

  /** Snapshot the data (never the UI), mutate, notify. */
  commit(label, mutate) {
    const { vehicles, drivers, trips } = this.state;
    this.history.push({ label, snap: structuredClone({ vehicles, drivers, trips }) });
    if (this.history.length > 20) this.history.shift();
    mutate(this.state);
    this.emit();
    return label;
  },

  undo() {
    const h = this.history.pop();
    if (!h) return null;
    Object.assign(this.state, h.snap);
    this.emit();
    return h.label;
  },
  canUndo() { return this.history.length > 0; },
}.init();

/* ============================================================================
   ACTIONS — the write side. Assigning a vehicle is one call that ripples
   into status, declarations, cost and carbon, because they are one record.
   ========================================================================= */
const A = {
  /** Cost of running this vehicle over this trip, in EUR. */
  estimateCost(veh, trip) {
    const perKm = veh.costPerKm;
    const fuel = Math.round(trip.distanceKm * perKm * 0.62);
    const tolls = Math.round(trip.distanceKm * perKm * 0.14);
    const ferry = trip.corridor === "TR → UK" ? 890 : 0;
    const perDiem = Math.max(1, Math.round(trip.distanceKm / 700)) * 65;
    return { fuel, tolls, ferry, perDiem, total: fuel + tolls + ferry + perDiem, currency: "EUR" };
  },

  /** ~87 g CO₂e per tonne-km is the usual figure for a loaded heavy truck. */
  estimateCo2(trip) { return Math.round(trip.distanceKm * trip.weightT * 0.087); },

  assignVehicle(tripRef, vehicleId, driverId = null) {
    return Store.commit(`Assign ${tripRef}`, st => {
      const trip = st.trips.find(t => t.ref === tripRef);
      const veh = st.vehicles.find(v => v.id === vehicleId);
      if (!trip || !veh) return;

      /* Whoever was carrying it goes back to the pool */
      if (trip.vehicleId && trip.vehicleId !== veh.id) {
        const old = st.vehicles.find(v => v.id === trip.vehicleId);
        if (old) old.status = "available";
      }

      trip.vehicleId = veh.id;
      if (driverId) trip.driverId = driverId;
      trip.status = "active";
      trip.declarations = {
        uetds: "filed",                                             // must be filed before departure
        ncts: trip.corridor === "TR → TR" ? "not_required" : "draft",
        ens: trip.corridor === "TR → UK" ? "draft" : "not_required",
        gvms: trip.corridor === "TR → UK" ? "draft" : "not_required",
      };
      trip.cost = A.estimateCost(veh, trip);
      trip.co2eKg = A.estimateCo2(trip);

      veh.status = "on_trip";
      veh.corridor = trip.corridor;
    });
  },

  renewDocument(vehicleId) {
    return Store.commit("Renew documents", st => {
      const v = st.vehicles.find(x => x.id === vehicleId);
      if (v) v.docs = { state: "valid" };
    });
  },

  scheduleMaintenance(vehicleId, on = "15 Sep") {
    return Store.commit("Schedule service", st => {
      const v = st.vehicles.find(x => x.id === vehicleId);
      if (v) v.maint = { state: "scheduled", on };
    });
  },

  takeOutOfService(vehicleId) {
    return Store.commit("Take out of service", st => {
      const v = st.vehicles.find(x => x.id === vehicleId);
      if (v) v.status = "out_of_service";
    });
  },

  /** Phase 7 will call this on a timer; it already works. */
  advanceSimulation() {
    return Store.commit("Advance", st => {
      st.vehicles.filter(v => v.status === "on_trip").forEach(v => { v.km += 40 + Math.floor(rnd() * 90); });
    });
  },

  undo() { return Store.undo(); },
};

    if (u.tab === "attention") list = list.filter(v => v.docs.state === "expired" || v.maint.state === "overdue" || v.status === "out_of_service");

  /* --- Trips and drivers ------------------------------------------------ */
  trips: () => Store.state.trips,
  activeTrips: () => S.trips().filter(t => t.status === "active"),
  unassignedTrips: () => S.trips().filter(t => t.status === "unassigned"),
  tripByRef: ref => S.trips().find(t => t.ref === ref),
  drivers: () => Store.state.drivers,
  driverFor: v => S.drivers().find(d => d.vehicleId === v.id) || null,
  freeDrivers: () => S.drivers().filter(d => !d.vehicleId),
  driversNearLimit: () => S.drivers().filter(d => d.vehicleId && d.minutesLeft < 60).length,

  /** Exactly the rows the Documents rail item opens onto — badge and table agree. */
  docsNeedingWork: (scope = "own") => S.all().filter(v =>
    v.ownership === scope && (v.docs.state === "expiring" || v.docs.state === "expired")).length,

  /** Fleet-wide all-in cost. The EU average for a heavy truck is ~€1.42/km. */
  costPerKm: () => (S.all().reduce((sum, v) => sum + v.costPerKm, 0) / S.all().length).toFixed(2),

  /* --- Compliance: the safety net the customs module already promises ----
     Returns one row per check: ok / warn / bad, with the reason spelled out
     and a concrete fix where one exists. A single bad row blocks assignment. */
  compliance(v, d, trip) {
    const out = [];
    const push = (level, name, why, fix = null, act = null) => out.push({ level, name, why, fix, act });

    if (v.status === "available") push("ok", "Vehicle status", "Available");
    else push("bad", "Vehicle status", `${T_STATUS[v.status].label} — not free to take a trip`,
              v.status === "maintenance" ? "Wait for the service to close" : "Pick another vehicle");

    if (trip.adr) {
      if (v.adr) push("ok", "ADR certificate", "Valid — cleared for dangerous goods");
      else push("bad", "ADR certificate", "Load is ADR class 3; this vehicle is not certified",
                "Choose an ADR-certified vehicle");
    }

    const tripDays = Math.max(1, Math.ceil(trip.distanceKm / 700));
    if (v.docs.state === "expired")
      push("bad", "Documents", `Expired ${v.docs.days}d ago — the vehicle cannot legally move`,
           "Renewal is same-day in the portal", { type: "renew", label: "Renew documents" });
    else if (v.docs.state === "expiring")
      v.docs.days > tripDays
        ? push("warn", "Documents", `Expires in ${v.docs.days}d — trip ends ${v.docs.days - tripDays}d before that`)
        : push("bad", "Documents", `Expires in ${v.docs.days}d — that falls mid-trip`,
                "Renew now or pick another vehicle", { type: "renew", label: "Renew documents" });
    else push("ok", "Documents", v.docs.state === "not_required" ? "Not required on this corridor" : "Valid");

    if (v.maint.state === "overdue")
      push("bad", "Maintenance", `Overdue by ${nfmt(v.maint.km)} km`,
           "Booking a slot clears the block", { type: "service", label: "Schedule service" });
    else if (v.maint.state === "due" && v.maint.km < trip.distanceKm)
      push("warn", "Maintenance", `Due in ${nfmt(v.maint.km)} km, trip runs ${nfmt(trip.distanceKm)} km`);
    else push("ok", "Maintenance", "Inside the service window");

    if (!d) push("bad", "Driver", "No driver on this vehicle", "Assign a driver");
    else if (d.minutesLeft < trip.legMin) {
      const alt = S.freeDrivers().find(x => x.minutesLeft >= trip.legMin && (!trip.adr || x.adr));
      push("bad", "Driver hours", `${hm(d.minutesLeft)} remaining, leg requires ${hm(trip.legMin)}`,
           alt ? `${alt.name} is on the bench with ${hm(alt.minutesLeft)}` : "No spare driver has enough hours",
           alt ? { type: "swapDriver", driverId: alt.id, label: `Assign ${alt.name}` } : null);
    } else push("ok", "Driver hours", `${hm(d.minutesLeft)} remaining, leg requires ${hm(trip.legMin)}`);

    if (v.corridor === trip.corridor) push("ok", "Corridor", `Already runs ${trip.corridor}`);

    return out;
  },

  /** Why this vehicle sits where it sits — one line, always shown. */
  rankReason(v, d, trip, checks, place) {
    const bad = checks.filter(c => c.level === "bad");
    if (bad.length) return bad.map(c => c.name).join(" and ") + (bad.length > 1 ? " block" : " blocks") + " this vehicle";
    const good = [];
    if (v.corridor === trip.corridor) good.push(`already runs ${trip.corridor}`);
    if (v.ownership === "own") good.push("own fleet, no subcontractor margin");
    if (d && d.minutesLeft >= trip.legMin) good.push("driver has hours for the whole leg");
    if (v.docs.state === "valid") good.push("documents clear");
    return (place === 0 ? "Ranked first: " : "") + (good.slice(0, 3).join(", ") || "meets every check");
  },

  /** Suitability, not the alphabet. Hard failures sink a vehicle to the bottom. */
  rankVehiclesForLeg(tripRef) {
    const trip = S.tripByRef(tripRef);
    if (!trip) return [];
    return S.all()
      .map(v => {
        const d = S.driverFor(v);
        const checks = S.compliance(v, d, trip);
        const blockers = checks.filter(c => c.level === "bad").length;
        const warnings = checks.filter(c => c.level === "warn").length;
        /* A truck that is simply busy is further away than one that needs a
           co-driver, so blockers are not all worth the same. */
        const WEIGHT = { "Vehicle status": 60, "Driver": 55, "ADR certificate": 50,
                         "Documents": 45, "Maintenance": 40, "Driver hours": 30 };
        let score = 100;
        checks.forEach(c => {
          if (c.level === "bad") score -= (WEIGHT[c.name] || 40);
          else if (c.level === "warn") score -= 9;
        });
        if (v.corridor === trip.corridor) score += 6;
        if (v.ownership === "own") score += 4;
        if (trip.adr && v.adr) score += 4;
        return { vehicle: v, driver: d, checks, blockers, warnings,
                 score: Math.max(0, Math.min(100, Math.round(score))) };
      })
      .sort((a, b) => b.score - a.score || a.vehicle.plate.localeCompare(b.vehicle.plate))
      .map((r, i) => ({ ...r, reason: S.rankReason(r.vehicle, r.driver, trip, r.checks, i) }));
  },

};

/* ============================================================================
   PREFERENCES
   ========================================================================= */
const Prefs = {
  read(k, fb) { try { return localStorage.getItem(k) || fb; } catch { return fb; } },
  write(k, v) { try { localStorage.setItem(k, v); } catch {} },
  theme: null, density: null,
  applyTheme(v) {
    this.theme = v;
    document.documentElement.dataset.theme = v;
    const b = document.getElementById("theme-btn");
    b.innerHTML = ico(v === "dark" ? "sun" : "moon", "ico ico--sm");
    b.setAttribute("aria-label", v === "dark" ? "Switch to light theme" : "Switch to dark theme");
  },
  applyDensity(v) {
    this.density = v;
    document.documentElement.dataset.density = v;
    document.getElementById("density-btn")
      .setAttribute("aria-label", v === "compact" ? "Switch to comfortable rows" : "Switch to compact rows");
  },
  init() {
    this.applyTheme(this.read("mt-theme", matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
    this.applyDensity(this.read("mt-density", "comfortable"));
  },
  toggleTheme() { const v = this.theme === "dark" ? "light" : "dark"; this.write("mt-theme", v); this.applyTheme(v); },
  toggleDensity() { const v = this.density === "compact" ? "comfortable" : "compact"; this.write("mt-density", v); this.applyDensity(v); },
};

/* ============================================================================
   TOAST
   ========================================================================= */
function toast(message, { action, onAction, ms = 6000 } = {}) {
  const host = document.getElementById("toasts");
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<span class="u-grow">${message}</span>`;
  if (action) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = action;
    b.onclick = () => { onAction?.(); el.remove(); };
    el.append(b);
  }
  host.append(el);
  setTimeout(() => el.remove(), ms);
}

const currentRoute = () => {
  const id = location.hash.replace(/^#\/?/, "") || "overview";
  return ROUTES.find(r => r.id === id) || ROUTES[0];
};

function renderNav() {
  const active = currentRoute().id;
  document.getElementById("nav").innerHTML = ROUTES.filter(r => !r.hidden).map(r => {
    const n = r.badge?.();
    return `<a class="nav__item" href="#/${r.id}" ${r.id === active ? 'aria-current="page"' : ""}>

      ${n ? `<span class="nav__badge${r.bad ? " nav__badge--bad" : ""}">${n}</span>` : ""}
    </a>`;
  }).join("");
}

function render() {
  const route = currentRoute();
  const host = document.getElementById("view");
  const focusId = document.activeElement?.dataset?.focusId;
  const caret = focusId && "selectionStart" in document.activeElement
    ? [document.activeElement.selectionStart, document.activeElement.selectionEnd] : null;

  document.getElementById("page-title").textContent = route.title;
  document.title = `${route.title} — Modaltrans Fleet`;
  host.innerHTML = (views[route.id] || (() => ""))();
  renderNav();

  if (focusId) {
    const el = host.querySelector(`[data-focus-id="${focusId}"]`);
    if (el) { el.focus(); if (caret && el.setSelectionRange) { try { el.setSelectionRange(...caret); } catch {} } }
  }
}
let lastRoute = null;
function navigate() {
  const id = currentRoute().id;
  if (PRESETS[id] && lastRoute !== id) Object.assign(Store.state.ui, PRESETS[id], { selected: null });
  lastRoute = id;
  render();
  window.scrollTo(0, scrollMemory.get(currentRoute().id) || 0);
  document.getElementById("view").focus({ preventScroll: true });
}
addEventListener("hashchange", navigate);
addEventListener("scroll", () => scrollMemory.set(currentRoute().id, window.scrollY), { passive: true });
Store.subscribe(render);

  if (!trips.length) return soon("Every leg has a truck",
    "Nothing is waiting for a vehicle right now. New road legs from Freight land here as they are booked.");

  const trip = S.tripByRef(a.tripRef) || trips[0];
  const ranked = S.rankVehiclesForLeg(trip.ref);
  const visible = a.showAll ? ranked : ranked.slice(0, 6);
  const rest = ranked.length - visible.length;

  const sel = a.vehicleId ? ranked.find(r => r.vehicle.id === a.vehicleId) : null;
  const driver = sel ? (a.driverId ? S.drivers().find(d => d.id === a.driverId) : sel.driver) : null;
  const checks = sel ? S.compliance(sel.vehicle, driver, trip) : [];
  const blockers = checks.filter(c => c.level === "bad");

  /* --- left: the legs waiting ------------------------------------------- */
  const list = trips.map(t => `
    <button class="triprow" type="button" data-trip="${t.ref}" aria-selected="${t.ref === trip.ref}">
      <span class="triprow__top">
        <span class="triprow__ref">${esc(t.ref)}</span>
        <span class="u-xs u-muted">${esc(t.corridor)}</span>
        ${t.adr ? `<span class="chip chip--warn" style="margin-left:auto">${ico("alert", "ico ico--sm")}ADR</span>` : ""}
      </span>
      <span class="triprow__meta">${esc(t.origin)} → ${esc(t.destination)} · pickup ${t.pickup} · ${t.weightT}t ${esc(t.body)}</span>
    </button>`).join("");

  /* --- right: candidates, best first ------------------------------------ */
  const cards = visible.map((r, i) => {
    const isSel = sel && r.vehicle.id === a.vehicleId;
    return `
    <div class="rankcard${r.blockers ? " rankcard--blocked" : ""}" role="button" tabindex="0"
         data-rank="${r.vehicle.id}" aria-selected="${!!isSel}">
      <span class="rankcard__top">
        <span class="identifier" style="color:var(--text)">${esc(r.vehicle.plate)}</span>
        ${r.vehicle.ownership === "subcontracted" ? `<span class="chip chip--outline">${esc(r.vehicle.carrier)}</span>` : ""}
        ${r.blockers ? `<span class="chip chip--bad">${ico("x-circle", "ico ico--sm")}${r.blockers} blocker${r.blockers === 1 ? "" : "s"}</span>` : ""}
        <span class="rankcard__score">${r.score}<span class="rankcard__max"> /100</span></span>
      </span>
      <span class="rankcard__sub">${esc(r.vehicle.model)}${r.driver ? " · " + esc(r.driver.name) + " · " + hm(r.driver.minutesLeft) + " left" : " · no driver"}</span>
      <span class="rankcard__why">${i === 0 && !r.blockers ? "" : ""}${esc(r.reason)}</span>
      ${isSel ? `<div class="checks">${checks.map(c => `
        <div class="check-row">
          <span class="check-row__ico check-row__ico--${c.level}">${ico(CHECK_ICON[c.level], "ico ico--sm")}</span>
          <span class="check-row__name">${esc(c.name)}</span>
          <span class="u-grow">
            <span class="check-row__why">${esc(c.why)}</span>
            ${c.act ? `<span class="check-row__fix">
              <button class="btn btn--secondary btn--sm" type="button"
                      data-fix="${c.act.type}" data-fix-driver="${c.act.driverId || ""}">${esc(c.act.label)}</button>
              <span class="u-xs u-muted">${esc(c.fix || "")}</span>
            </span>` : ""}
          </span>
        </div>`).join("")}</div>` : ""}
    </div>`;
  }).join("");

  const barMessage = !sel
    ? "Pick a vehicle to see whether it can legally run this leg."
    : blockers.length
      ? `${blockers.map(b => b.name).join(" and ")} must be cleared first.`
      : `${esc(sel.vehicle.plate)} passes every check.`;

  return `
  <div class="split">
    <section class="panel">
      <div class="toolbar"><div><div class="card__title">Unassigned legs</div>
        <div class="card__hint tnum">${trips.length} waiting · pickup within 48 hours</div></div></div>
      <div class="triplist">${list}</div>
    </section>

    <section class="panel">
      <div class="triphead">
        <div class="u-grow" style="min-width:12rem">
          <div class="card__title">${esc(trip.ref)} · ${esc(trip.origin)} → ${esc(trip.destination)}</div>
          <div class="card__hint">${esc(trip.corridor)} · pickup ${trip.pickup} · ETA ${trip.eta}</div>
        </div>
        <div class="tripfact"><b>${nfmt(trip.distanceKm)} km</b><span>distance</span></div>
        <div class="tripfact"><b>${hm(trip.legMin)}</b><span>driving, next leg</span></div>
        <div class="tripfact"><b>${trip.weightT}t</b><span>${esc(trip.body)}</span></div>
        ${trip.adr ? `<div class="tripfact"><b><span class="tip" data-tip="Dangerous goods. The vehicle and the driver both need a valid ADR certificate.">ADR class 3</span></b><span>restriction</span></div>` : ""}
      </div>

      <div class="filters" style="border-top:1px solid var(--border)">
        <span class="u-sm u-strong">Best vehicle for this leg</span>
        <span class="u-xs u-muted">ranked by suitability, not alphabetically</span>
        <span class="u-grow"></span>
        <span class="u-xs u-muted tnum">${ranked.length} in the fleet</span>
      </div>

      ${cards}
      ${rest > 0 ? `<button class="btn btn--ghost" type="button" data-assign-more
          style="width:100%;justify-content:center;border-radius:0;border-bottom:1px solid var(--border)">
          Show ${rest} more — all have blockers</button>` : ""}

      <div class="actionbar">
        <span class="u-sm ${blockers.length ? "u-dim" : "u-muted"}">${barMessage}</span>
        <span class="u-grow"></span>
        ${sel ? `<button class="btn btn--ghost" type="button" data-assign-cancel>Clear selection</button>` : ""}
        <button class="btn btn--primary" type="button" data-assign-confirm
                ${!sel || blockers.length ? "disabled" : ""}>
          ${sel ? `Assign ${esc(sel.vehicle.plate)}` : "Assign vehicle"}
        </button>
      </div>
    </section>
  </div>`;
};

/* ============================================================================
   EVENTS — one delegated listener for the whole app
   ========================================================================= */
document.addEventListener("click", e => {
  const t = e.target;
  const hit = sel => t.closest(sel);

  if (hit("#theme-btn")) return Prefs.toggleTheme();
  if (hit("#density-btn")) return Prefs.toggleDensity();
  if (hit("#tour-btn")) return toast("The guided story arrives in Phase 8.");

  const scope = hit("[data-scope]");
  if (scope) return Store.ui({ scope: scope.dataset.scope, page: 0, selected: null });

  const tab = hit("[data-tab]");
  if (tab) return Store.ui({ tab: tab.dataset.tab, page: 0 });

  const clear = hit("[data-clear]");
  if (clear) {
    const k = clear.dataset.clear;
    return Store.ui(k === "all" ? { q: "", corridor: null, docFilter: null } : { [k]: k === "q" ? "" : null });
  }

  const filter = hit("[data-filter]");
  if (filter) {
    if (filter.dataset.filter === "corridor") {
      const order = [null, "TR → UK", "TR → DE", "TR → NL"];
      return Store.ui({ corridor: order[(order.indexOf(Store.state.ui.corridor) + 1) % order.length] });
    }
    return Store.ui({ docFilter: Store.state.ui.docFilter ? null : "expiring" });
  }

  const startAssign = hit("[data-assign-start]");
  if (startAssign) {
    Object.assign(Store.state.ui.assign, { vehicleId: startAssign.dataset.assignStart, driverId: null, done: null });
    location.hash = "#/assign";
    return;
  }
  const svc = hit("[data-service]");
  if (svc) { A.scheduleMaintenance(svc.dataset.service); return toast("Service booked for 15 Sep.", { action: "Undo", onAction: () => { A.undo(); toast("Booking undone."); } }); }
  if (hit("[data-clear-selection]")) return Store.ui({ selected: null });

  const row = hit("[data-vehicle]");
  if (row) {
    const id = row.dataset.vehicle;
    return Store.ui({ selected: Store.state.ui.selected === id ? null : id });
  }

  const attn = hit("[data-attn]");
  if (attn) {
    const k = attn.dataset.attn;
    if (k === "unassigned") { location.hash = "#/assign"; return; }
    const map = { expired: { tab: "attention", docFilter: null }, overdue: { tab: "attention" }, expiring: { tab: "all", docFilter: "expiring" } };
    Object.assign(Store.state.ui, { scope: "own", q: "", corridor: null, docFilter: null }, map[k] || { tab: "attention" });
    location.hash = "#/vehicles";
    return;
  }

  /* --- assign flow ---------------------------------------------------- */
  const fixBtn = hit("[data-fix]");
  if (fixBtn) {
    const a = assignState();
    const kind = fixBtn.dataset.fix;
    if (kind === "swapDriver") return setAssign({ driverId: fixBtn.dataset.fixDriver });
    if (kind === "renew") { A.renewDocument(a.vehicleId); return toast("Documents renewed."); }
    if (kind === "service") { A.scheduleMaintenance(a.vehicleId); return toast("Service booked for 15 Sep."); }
    return;
  }

  const tripBtn = hit("[data-trip]");
  if (tripBtn) return setAssign({ tripRef: tripBtn.dataset.trip, vehicleId: null, driverId: null, showAll: false });

  const rankBtn = hit("[data-rank]");
  if (rankBtn) return setAssign({ vehicleId: rankBtn.dataset.rank, driverId: null });

  if (hit("[data-assign-more]")) return setAssign({ showAll: true });
  if (hit("[data-assign-cancel]")) return setAssign({ vehicleId: null, driverId: null });
  if (hit("[data-assign-another]")) return setAssign({ done: null, tripRef: null, vehicleId: null, driverId: null, showAll: false });
  if (hit("[data-assign-undo]")) { A.undo(); setAssign({ done: null }); return toast("Assignment undone."); }

  if (hit("[data-assign-confirm]")) {
    const a = assignState();
    const trip = S.tripByRef(a.tripRef) || S.unassignedTrips()[0];
    A.assignVehicle(trip.ref, a.vehicleId, a.driverId);
    const t = S.tripByRef(trip.ref);
    setAssign({ done: { tripRef: trip.ref, vehicleId: a.vehicleId } });
    toast(`${trip.ref} assigned · U-ETDS filed · €${nfmt(t.cost.total)} costed`, {
      action: "Undo",
      onAction: () => { A.undo(); setAssign({ done: null }); toast("Assignment undone."); },
    });
    return;
  }

  const genie = hit("[data-genie]");
  if (genie) {
    if (genie.dataset.genie !== "apply") return toast("Suggestion dismissed. Genie has 2 more.");
    A.assignVehicle("TR-4471", "v5");
    const t = S.tripByRef("TR-4471");
    toast(`TR-4471 moved to 34 TR 6135 · U-ETDS filed · €${nfmt(t.cost.total)} costed`,
      { action: "Undo", onAction: () => { A.undo(); toast("Move undone — TR-4471 is back on 34 TR 7712."); } });
    return;
  }
});

document.addEventListener("input", e => {
  if (e.target.dataset.role === "search") Store.ui({ q: e.target.value });
});

document.addEventListener("keydown", e => {
  const card = e.target.closest?.("[data-vehicle],[data-rank]");
  if (card && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); return card.click(); }
  if (e.key === "/" && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) {
    const box = document.querySelector('[data-role="search"]');
    if (box) { e.preventDefault(); box.focus(); box.select(); }
  }
});

/* ============================================================================
   BOOT
   ========================================================================= */
/* Console handle so the data layer can be exercised without the UI:
   MT.A.assignVehicle("TR-4482", "v4") · MT.S.rankVehiclesForLeg("TR-4482") · MT.A.undo() */
window.MT = { Store, S, A, T_STATUS, T_MAINT, T_DOCS };

Prefs.init();
navigate();
</script>
